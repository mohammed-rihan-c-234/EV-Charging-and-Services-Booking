<!-- Stats Box Component -->
<div class="col-md-{{ cols|default:"3" }} col-sm-6 mb-4" data-aos="fade-up" data-aos-delay="{{ delay|default:"0" }}">
    <div class="stats-box" style="background: {{ gradient|default:'var(--gradient-primary)' }};">
        <div class="stats-number">{{ number }}</div>
        <div class="stats-label">{{ label }}</div>
    </div>
</div>
