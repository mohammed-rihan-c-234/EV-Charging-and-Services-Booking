{% extends "admin_portal/base.html" %}

{% block portal_content %}
<div class="card border-0" style="box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);">
    <div class="card-header" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white;">
        <h5 class="mb-0">Delete {{ meta.verbose_name|title }}</h5>
    </div>
    <div class="card-body">
        <p>Are you sure you want to delete this record?</p>
        <div class="alert alert-warning">
            <strong>{{ instance }}</strong>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button class="btn btn-danger" type="submit">Yes, Delete</button>
                <a class="btn btn-outline-secondary" href="{% url 'admin_portal:model_list' meta.app_label meta.model_name %}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
